name: CI

on:
  push:
    branches:
      - 'main'
      - '1.x'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: Crustum/.github/.github/workflows/testsuite-without-db.yml@v1
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5", "8.6"]'
      os: '["ubuntu-24.04", "windows-latest"]'
      extensions: 'mbstring, intl, pdo_sqlite'
      test-cmd: 'vendor/bin/phpunit --configuration=phpunit.xml --display-deprecations --display-incomplete --display-skipped'
      coverage-php: '8.2'
    secrets: inherit

  cs:
    uses: Crustum/.github/.github/workflows/cs-stan.yml@v1
    with:
      php: '8.3'
    secrets: inherit
